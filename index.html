<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTracker V2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">◈</div>

    <div>
        <h1>JobTracker V2</h1>
        <p>Suivi professionnel des candidatures</p>
    </div>
</header>

<main>

    <section class="stats">

        <div class="stat">
            <span>Total</span>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <span>Entretiens</span>
            <strong id="entretiens">0</strong>
        </div>

        <div class="stat">
            <span>Offres</span>
            <strong id="offres">0</strong>
        </div>

    </section>

    <section class="form">

        <input id="company" placeholder="Entreprise">
        <input id="position" placeholder="Poste">

        <button onclick="addCandidate()">
            Ajouter la candidature
        </button>

    </section>

    <section class="board">

        <div class="column">
            <h2>📄 À envoyer</h2>
            <div id="col0"></div>
        </div>

        <div class="column">
            <h2>📨 Envoyée</h2>
            <div id="col1"></div>
        </div>

        <div class="column">
            <h2>🎙 Entretien</h2>
            <div id="col2"></div>
        </div>

        <div class="column">
            <h2>✅ Offre</h2>
            <div id="col3"></div>
        </div>

        <div class="column">
            <h2>❌ Refus</h2>
            <div id="col4"></div>
        </div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
